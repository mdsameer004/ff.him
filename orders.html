<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Friends Florist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/floral-theme.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .page-header {
            padding: 100px 0 60px;
            text-align: center;
            background-color: var(--color-light-pink);
            margin-bottom: 40px;
        }
        
        .orders-container {
            max-width: 900px;
            margin: 0 auto 80px;
        }

        .order-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .order-header {
            background: var(--color-light-green);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--color-border);
        }

        .order-info {
            display: flex;
            gap: 30px;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            font-size: 0.9rem;
        }

        .info-label {
            color: var(--color-text-light);
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 600;
            color: var(--color-text-main);
        }

        .order-status {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-received  { background: #e8f4fd; color: #1a5276; }
        .status-processing { background: #fff3cd; color: #856404; }
        .status-shipped    { background: #cce5ff; color: #004085; }
        .status-delivered  { background: #d4edda; color: #155724; }
        .status-cancelled  { background: #f8d7da; color: #721c24; }

        .order-body {
            padding: 30px;
        }

        .order-item-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed var(--color-border);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 20px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        
        .item-meta {
            color: var(--color-text-light);
            font-size: 0.9rem;
        }
        
        .item-price {
            font-weight: 600;
            color: var(--color-dark-green);
        }

        .empty-orders {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--border-radius);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .order-info {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/android-fixes.css">

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
    
    <div id="navbar-container"></div>

    <main>
        <header class="page-header">
            <div class="container">
                <h1 class="section-title">My Orders</h1>
                <p>Track your recent floral deliveries</p>
            </div>
        </header>

        <section class="container orders-container" id="orders-list">
            <!-- Populated by JS -->
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
        const API_BASE = 'https://floristbackend.onrender.com/api';
        const TOKEN_KEY = 'ff_user_token';
        const USER_KEY  = 'ff_user';

        // ── Status badge helper ────────────────────────────────────────────────
        const STATUS_LABELS = {
            received:        { label: 'Order Received',    cls: 'status-received' },
            processing:      { label: 'Processing',        cls: 'status-processing' },
            out_for_delivery:{ label: 'Out for Delivery',  cls: 'status-shipped' },
            delivered:       { label: 'Delivered',         cls: 'status-delivered' },
            cancelled:       { label: 'Cancelled',         cls: 'status-cancelled' },
        };

        function statusBadge(s) {
            const st = STATUS_LABELS[s] || { label: s || 'Processing', cls: 'status-processing' };
            return `<span class="order-status ${st.cls}">${st.label}</span>`;
        }

        function formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // ── Render orders list ─────────────────────────────────────────────────
        function renderOrders(orders, container) {
            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-orders">
                        <div class="empty-icon">📦</div>
                        <h2 style="font-family:var(--font-heading);color:var(--color-dark-green);margin-bottom:15px;">No orders yet</h2>
                        <p style="color:var(--color-text-light);margin-bottom:30px;">You haven't placed any orders with us yet.</p>
                        <a href="shop.html" class="btn btn-primary">Start Shopping</a>
                    </div>`;
                return;
            }

            container.innerHTML = orders.map(order => {
                const orderId   = order.orderId || order._id || order.id || order.backendId || '—';
                const date      = formatDate(order.createdAt || order.date);
                const total     = order.totalAmount || order.total || 0;
                const status    = order.orderStatus || order.status || 'received';
                const items     = order.items || [];

                const itemsHtml = items.map(item => `
                    <li class="order-item">
                        <img src="${item.image || (item.product && item.product.image) || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=80'}"
                             alt="${item.name}" class="item-img"
                             onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=80'">
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-meta">Qty: ${item.quantity} &nbsp;|&nbsp; ₹${Number(item.price).toLocaleString('en-IN')} each</div>
                        </div>
                        <div class="item-price">₹${(item.price * item.quantity).toLocaleString('en-IN')}</div>
                    </li>`).join('');

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="order-info">
                                <div class="info-block">
                                    <span class="info-label">Order ID</span>
                                    <span class="info-value">${String(orderId).startsWith('ORD-') ? orderId : '#' + String(orderId).slice(-8).toUpperCase()}</span>
                                </div>
                                <div class="info-block">
                                    <span class="info-label">Date Placed</span>
                                    <span class="info-value">${date}</span>
                                </div>
                                <div class="info-block">
                                    <span class="info-label">Total Amount</span>
                                    <span class="info-value">₹${Number(total).toLocaleString('en-IN')}</span>
                                </div>
                            </div>
                            ${statusBadge(status)}
                        </div>
                        <div class="order-body">
                            <h4 style="margin-bottom:20px;font-size:1.1rem;color:var(--color-dark-green);">Order Items</h4>
                            <ul class="order-item-list">${itemsHtml}</ul>
                        </div>
                    </div>`;
            }).join('');
        }

        // ── Main: load orders ──────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('orders-list');
            const token     = localStorage.getItem(TOKEN_KEY);
            const userJson  = localStorage.getItem(USER_KEY);

            // Show loading state
            container.innerHTML = `<div style="text-align:center;padding:60px;color:var(--color-text-light);">
                <div style="font-size:2rem;margin-bottom:16px;">⏳</div>Loading your orders...</div>`;

            if (token && userJson) {
                // ── Logged-in user: fetch from backend ─────────────────────────
                try {
                    const res = await fetch(`${API_BASE}/orders/my-orders`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (res.ok) {
                        const data = await res.json();
                        renderOrders(data.data, container);
                    } else if (res.status === 401) {
                        // Token expired — clear and ask to login
                        localStorage.removeItem(TOKEN_KEY);
                        localStorage.removeItem(USER_KEY);
                        container.innerHTML = `
                            <div class="empty-orders">
                                <div class="empty-icon">🔒</div>
                                <h2 style="font-family:var(--font-heading);color:var(--color-dark-green);margin-bottom:15px;">Session Expired</h2>
                                <p style="color:var(--color-text-light);margin-bottom:30px;">Please log in again to view your orders.</p>
                                <a href="auth.html?return=orders.html" class="btn btn-primary">Login</a>
                            </div>`;
                    } else {
                        throw new Error('Failed to fetch orders');
                    }
                } catch (err) {
                    console.warn('Could not fetch orders from backend:', err.message);
                    // Fallback to localStorage
                    const localOrders = JSON.parse(localStorage.getItem('friendsFloristOrders')) || [];
                    renderOrders(localOrders, container);
                }
            } else {
                // ── Guest: show login prompt ───────────────────────────────────
                container.innerHTML = `
                    <div class="empty-orders">
                        <div class="empty-icon">👤</div>
                        <h2 style="font-family:var(--font-heading);color:var(--color-dark-green);margin-bottom:15px;">Login to View Orders</h2>
                        <p style="color:var(--color-text-light);margin-bottom:30px;">
                            Your order history is saved to your account.<br>
                            Please login to see all your past orders.
                        </p>
                        <a href="auth.html?return=orders.html" class="btn btn-primary">Login / Register</a>
                    </div>`;
            }
        });
    </script>
    <script src="js/maintenance-check.js"></script>
</body>
</html>
