<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Friends Florist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/floral-theme.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .page-header {
            padding: 100px 0 60px;
            text-align: center;
            background-color: var(--color-light-pink);
            margin-bottom: 40px;
        }
        .gallery-filter {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 40px;
        }
        .filter-btn {
            padding: 8px 20px;
            border: 2px solid var(--color-dark-green);
            background: transparent;
            color: var(--color-dark-green);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--color-dark-green);
            color: white;
        }
        
        /* Album Grid Layout */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding-bottom: 80px;
        }
        .album-item {
            position: relative;
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            aspect-ratio: 1/1;
        }
        .album-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--border-radius);
            transition: transform 0.5s ease;
        }
        .album-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 25px;
            transition: background 0.3s ease;
        }
        .album-overlay h3 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-family: var(--font-heading);
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }
        .album-overlay p {
            font-size: 0.9rem;
            opacity: 0.8;
            transform: translateY(10px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .album-item:hover img {
            transform: scale(1.08);
        }

        /* Hall Decorations cover — rotate -45deg, keep 1:1 ratio */
        .album-cover-hall-decorations img {
            transform: rotate(-45deg) scale(1.4);
        }
        .album-cover-hall-decorations:hover img {
            transform: rotate(-45deg) scale(1.5);
        }

        /* Anniversary cover — rotate -45deg, keep 1:1 ratio */
        .album-cover-anniversary img {
            transform: rotate(-45deg) scale(1.4);
        }
        .album-cover-anniversary:hover img {
            transform: rotate(-45deg) scale(1.5);
        }

        /* Birthday cover — rotate -45deg, keep 1:1 ratio */
        .album-cover-birthday img {
            transform: rotate(-45deg) scale(1.4);
        }
        .album-cover-birthday:hover img {
            transform: rotate(-45deg) scale(1.5);
        }
        .album-item:hover .album-overlay {
            background: linear-gradient(to top, rgba(46,139,87,0.9) 0%, rgba(46,139,87,0.4) 100%);
        }
        .album-item:hover .album-overlay h3,
        .album-item:hover .album-overlay p {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 900px) {
            .album-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .album-overlay h3 { font-size: 1.2rem; margin-bottom: 0; }
            .album-overlay p { display: none; }
            .album-overlay { padding: 15px; }
        }
        
    </style>

    <link rel="stylesheet" href="css/android-fixes.css">

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
    
    <div id="navbar-container"></div>

    <main>
        <header class="page-header">
            <div class="container">
                <h1 class="section-title">Event & Decoration Gallery</h1>
                <p>Browse through our spectacular setups and premium floral arrangements.</p>
            </div>
        </header>

        <section class="container">
            <div class="album-grid" id="album-grid">
                <!-- Albums dynamically inserted -->
            </div>
        </section>
    </main>

    <div id="footer-container"></div>


    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/gallery-data.js"></script>
    <script>
        function renderAlbums() {
            const grid = document.getElementById('album-grid');
            grid.innerHTML = '';
            
            const data = window.albumsData || albumsData || [];
            data.forEach((album) => {
                const div = document.createElement('div');
                div.className = `album-item album-cover-${album.id}`;
                div.innerHTML = `
                    <img src="${album.cover}" loading="lazy" alt="${album.title}">
                    <div class="album-overlay">
                        <h3>${album.title}</h3>
                        <p>${album.images.length} Photos</p>
                    </div>
                `;
                div.onclick = () => openAlbum(album.id);
                grid.appendChild(div);
            });
        }

        function openAlbum(albumId) {
            window.location.href = `album.html?id=${albumId}`;
        }

        // Init
        document.addEventListener('DOMContentLoaded', renderAlbums);
    </script>
</body>
</html>
