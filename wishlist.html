<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Friends Florist</title>
    <meta name="description" content="View and manage your saved products on Friends Florist wishlist.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/floral-theme.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .page-header {
            padding: 100px 0 60px;
            text-align: center;
            background-color: var(--color-light-pink);
            margin-bottom: 40px;
        }

        .wishlist-container {
            max-width: 1200px;
            margin: 0 auto 80px;
            padding: 0 20px;
        }

        .wishlist-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .wishlist-count {
            font-size: 1rem;
            color: var(--color-text-light);
        }

        .btn-clear-wishlist {
            background: transparent;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-body);
        }

        .btn-clear-wishlist:hover {
            background: #e74c3c;
            color: white;
        }

        @media (max-width: 600px) {
            .wishlist-meta {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
    <link rel="stylesheet" href="css/android-fixes.css">

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>

    <div id="navbar-container"></div>

    <main>
        <header class="page-header">
            <div class="container">
                <h1 class="section-title">My Wishlist</h1>
                <p>Products you've saved for later ❤️</p>
            </div>
        </header>

        <section class="wishlist-container">
            <div class="wishlist-meta" id="wishlist-meta" style="display:none;">
                <span class="wishlist-count" id="wishlist-count"></span>
                <button class="btn-clear-wishlist" onclick="clearWishlist()">Clear All</button>
            </div>
            <div id="wishlist-grid"></div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderWishlistPage();

            const wishlist = loadWishlist();
            const meta = document.getElementById('wishlist-meta');
            const countEl = document.getElementById('wishlist-count');

            if (wishlist.length > 0) {
                meta.style.display = 'flex';
                countEl.textContent = `${wishlist.length} item${wishlist.length > 1 ? 's' : ''} saved`;
            }
        });

        function clearWishlist() {
            customConfirm('Remove all items from your wishlist?', () => {
                localStorage.removeItem('friendsFloristWishlist');
                document.getElementById('wishlist-meta').style.display = 'none';
                renderWishlistPage();
                updateWishlistBadge();
                showToast('Wishlist cleared', 'info', 'Wishlist');
            });
        }
    </script>
</body>
</html>
