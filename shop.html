<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ SEO: Primary Title & Description -->
    <title>2 hour bouquet Delivery - Friends Florist</title>
    <meta name="description" content="Order fresh flower bouquets with fast 2 hour delivery from Friends Florist. Premium roses, anniversary bouquets, birthday flowers and elegant floral arrangements.">
    <meta name="keywords" content="flower delivery, 2 hour delivery, bouquet delivery, florist, same day flowers, fresh flowers, birthday bouquets, anniversary flowers, Hyderabad florist">
    <meta name="author" content="Friends Florist">
    <meta name="robots" content="index, follow">

    <!-- ✅ Canonical URL -->
    <link rel="canonical" href="https://friendsflorist.com/shop.html">

    <!-- ✅ Open Graph (Facebook / WhatsApp sharing) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://friendsflorist.com/shop.html">
    <meta property="og:title" content="2 hour bouquet Delivery - Friends Florist">
    <meta property="og:description" content="Order fresh flower bouquets with fast 2 hour delivery from Friends Florist. Premium roses, anniversary bouquets, birthday flowers and elegant floral arrangements.">
    <meta property="og:image" content="https://friendsflorist.com/images/floating/img1.png">
    <meta property="og:site_name" content="Friends Florist">
    <meta property="og:locale" content="en_IN">

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="2 hour bouquet Delivery - Friends Florist">
    <meta name="twitter:description" content="Order fresh flower bouquets with fast 2 hour delivery from Friends Florist. Premium roses, anniversary bouquets, birthday flowers and elegant floral arrangements.">
    <meta name="twitter:image" content="https://friendsflorist.com/images/floating/img1.png">

    <!-- ✅ Mobile / Browser Theme -->
    <meta name="theme-color" content="#2e8b57">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Friends Florist">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- ✅ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- ✅ Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/floral-theme.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .page-header {
            padding: 100px 0 60px;
            text-align: center;
            background-color: var(--color-light-pink);
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .shop-container {
            padding-bottom: 80px;
        }
        .products-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--color-border);
        }
        .header-top-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-count-row {
            font-size: 0.9rem;
            color: var(--color-text-light);
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sort-select {
            padding: 8px 15px;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            font-family: var(--font-body);
            outline: none;
            cursor: pointer;
        }
        /* Category Dropdown */
        .category-dropdown {
            position: relative;
        }
        .category-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            background: white;
            font-family: var(--font-body);
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s ease;
        }
        .category-btn:hover {
            border-color: var(--color-dark-green);
            color: var(--color-dark-green);
        }
        .category-btn svg {
            transition: transform 0.25s ease;
        }
        .category-btn.open svg {
            transform: rotate(180deg);
        }
        .category-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: white;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            min-width: 200px;
            z-index: 100;
            overflow: hidden;
            animation: dropIn 0.2s ease;
        }
        .category-menu.open {
            display: block;
        }
        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .category-menu a {
            display: block;
            padding: 11px 18px;
            font-family: var(--font-body);
            font-size: 0.93rem;
            color: var(--color-text-light);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-bottom: 1px solid #f3f3f3;
        }
        .category-menu a:last-child { border-bottom: none; }
        .category-menu a:hover {
            background: var(--color-light-pink);
            color: var(--color-dark-green);
        }
        .category-menu a.active {
            color: var(--color-dark-green);
            font-weight: 600;
            background: var(--color-light-pink);
        }
    </style>
    <link rel="stylesheet" href="css/android-fixes.css">
</head>
<body>
    
    <div id="navbar-container"></div>

    <main>
        <header class="page-header">
            <div class="container">
                <h1>Our Collection</h1>
                <p>Find the perfect arrangement for any occasion, or request something unique!</p>
                <a href="custom-order.html" class="btn btn-primary" style="margin-top: 20px;">Customize Order</a>
            </div>
        </header>

        <section class="container shop-container">

            <!-- Products Grid -->
            <div class="products-area">
                <div class="products-header">
                    <div class="header-top-row">
                        <div class="header-controls">
                            <!-- Category Dropdown -->
                            <div class="category-dropdown" id="category-dropdown">
                                <button class="category-btn" id="category-btn" onclick="toggleCategoryMenu()">
                                    <span id="category-label">Categories</span>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                                </button>
                                <div class="category-menu" id="category-menu">
                                    <a onclick="filterProducts('All')" class="active" id="cat-all">All Arrangements</a>
                                    <a onclick="filterProducts('Anniversary Flowers')" id="cat-anniversary">Anniversary Flowers</a>
                                    <a onclick="filterProducts('Birthday Bouquets')" id="cat-birthday">Birthday Bouquets</a>
                                    <a onclick="filterProducts('Event Decorations')" id="cat-event">Event Decorations</a>
                                    <a onclick="filterProducts('Wedding Decorations')" id="cat-wedding">Wedding Decorations</a>
                                </div>
                            </div>
                            <!-- Sort -->
                            <select class="sort-select" id="sort-select" onchange="sortProducts()">
                                <option value="featured">Sort: Featured</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="rating">Highest Rated</option>
                            </select>
                        </div>
                    </div>
                    <div class="header-count-row">
                        <p id="product-count">Showing 0 results</p>
                    </div>
                </div>
                
                <div class="modern-shop-grid" id="modern-shop-grid">
                    <!-- Products will be rendered here via JS -->
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="js/products.js?v=2.0.0"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentProducts = [];

        function renderShopGrid() {
            const grid = document.getElementById('modern-shop-grid');
            const count = document.getElementById('product-count');

            if (!currentProducts.length) {
                grid.innerHTML = '<p style="text-align:center;padding:40px;color:#888;">Loading products...</p>';
                count.textContent = 'Loading...';
                return;
            }

            grid.innerHTML = currentProducts.map(p => createModernProductCard(p)).join('');
            count.textContent = `Showing ${currentProducts.length} results`;
            if (typeof initHeartIcons === 'function') initHeartIcons();
        }

        function toggleCategoryMenu() {
            const btn = document.getElementById('category-btn');
            const menu = document.getElementById('category-menu');
            btn.classList.toggle('open');
            menu.classList.toggle('open');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('category-dropdown');
            if (dropdown && !dropdown.contains(e.target)) {
                document.getElementById('category-btn').classList.remove('open');
                document.getElementById('category-menu').classList.remove('open');
            }
        });

        function filterProducts(category) {
            document.querySelectorAll('#category-menu a').forEach(a => a.classList.remove('active'));
            const labelMap = {
                'All': 'All Arrangements',
                'Anniversary Flowers': 'Anniversary Flowers',
                'Birthday Bouquets': 'Birthday Bouquets',
                'Event Decorations': 'Event Decorations',
                'Wedding Decorations': 'Wedding Decorations'
            };
            const label = labelMap[category] || category;
            document.querySelectorAll('#category-menu a').forEach(a => {
                if (a.textContent === label) a.classList.add('active');
            });
            document.getElementById('category-label').textContent = category === 'All' ? 'Categories' : label;
            document.getElementById('category-btn').classList.remove('open');
            document.getElementById('category-menu').classList.remove('open');

            if (category === 'All') {
                currentProducts = [...window.products];
            } else {
                currentProducts = window.products.filter(p => p.category === category);
            }
            sortProducts();
        }

        function sortProducts() {
            const sortVal = document.getElementById('sort-select').value;
            if (sortVal === 'price-low') {
                currentProducts.sort((a, b) => a.price - b.price);
            } else if (sortVal === 'price-high') {
                currentProducts.sort((a, b) => b.price - a.price);
            } else if (sortVal === 'rating') {
                currentProducts.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            } else {
                currentProducts.sort((a, b) => (a.id || 0) - (b.id || 0));
            }
            renderShopGrid();
        }

        // Show loading state immediately
        renderShopGrid();

        // Re-render when API products arrive (called by products.js)
        window.onProductsLoaded(function(loadedProducts) {
            console.log('[shop.html] Products received from API, re-rendering grid:', loadedProducts.length);
            const urlParams = new URLSearchParams(window.location.search);
            const search = urlParams.get('search');
            const cat = urlParams.get('category');
            const deal = urlParams.get('deal');

            if (search) {
                currentProducts = loadedProducts.filter(p =>
                    p.name.toLowerCase().includes(search.toLowerCase()) ||
                    p.category.toLowerCase().includes(search.toLowerCase())
                );
                document.getElementById('product-count').textContent = `Search results for "${search}"`;
                renderShopGrid();
            } else if (cat) {
                filterProducts(cat);
            } else if (deal === 'anniversary') {
                filterProducts('Anniversary Flowers');
            } else {
                currentProducts = [...loadedProducts];
                sortProducts();
            }
        });
    </script>
</body>
</html>
