<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album - Friends Florist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/floral-theme.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .page-header {
            padding: 80px 0 40px;
            text-align: center;
            background-color: var(--color-light-pink);
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--color-dark-green);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .back-btn:hover {
            color: var(--color-soft-pink);
        }
        
        /* Album Gallery Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 80px;
        }
        .image-item {
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: var(--border-radius);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .image-item:hover img {
            transform: scale(1.05);
        }

        /* Hall Decorations — rotate images 45deg left */
        body.album-hall-decorations .image-item img {
            transform: rotate(-45deg) scale(1.3);
        }
        body.album-hall-decorations .image-item:hover img {
            transform: rotate(-45deg) scale(1.4);
        }
        body.album-hall-decorations .lightbox-img {
            transform: rotate(-45deg);
        }

        /* Anniversary — rotate images 45deg left */
        body.album-anniversary .image-item img {
            transform: rotate(-45deg) scale(1.3);
        }
        body.album-anniversary .image-item:hover img {
            transform: rotate(-45deg) scale(1.4);
        }
        body.album-anniversary .lightbox-img {
            transform: rotate(-45deg);
        }

        /* Birthday — rotate images 45deg left */
        body.album-birthday .image-item img {
            transform: rotate(-45deg) scale(1.3);
        }
        body.album-birthday .image-item:hover img {
            transform: rotate(-45deg) scale(1.4);
        }
        body.album-birthday .lightbox-img {
            transform: rotate(-45deg);
        }

        /* Sangeet — rotate images 45deg left */
        body.album-sangeet .image-item img {
            transform: rotate(-45deg) scale(1.3);
        }
        body.album-sangeet .image-item:hover img {
            transform: rotate(-45deg) scale(1.4);
        }
        body.album-sangeet .lightbox-img {
            transform: rotate(-45deg);
        }

        @media (max-width: 1024px) {
            .image-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            .image-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        
        /* Lightbox Style */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox-img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 4px;
            object-fit: contain;
        }
        .lightbox-close {
            position: absolute;
            top: 20px; right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            line-height: 1;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 3rem;
            cursor: pointer;
            user-select: none;
            padding: 20px;
            transition: color 0.3s;
        }
        .lightbox-nav:hover { color: var(--color-soft-pink); }
        .lightbox-prev { left: 10px; }
        .lightbox-next { right: 10px; }
        .lightbox-counter {
            position: absolute;
            bottom: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }
    </style>
    <link rel="stylesheet" href="css/android-fixes.css">
</head>
<body>
    
    <div id="navbar-container"></div>

    <main>
        <header class="page-header">
            <div class="container">
                <a href="gallery.html" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Gallery
                </a>
                <h1 class="section-title" id="album-title">Album Name</h1>
                <p id="album-desc">Browse through our spectacular floral arrangements.</p>
            </div>
        </header>

        <section class="container">
            <div class="image-grid" id="image-grid">
                <!-- Images dynamically inserted -->
            </div>
        </section>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <div class="lightbox-nav lightbox-prev" onclick="changeImage(-1, event)">&#10094;</div>
        <img src="" alt="Album Image" class="lightbox-img" id="lightbox-img">
        <div class="lightbox-nav lightbox-next" onclick="changeImage(1, event)">&#10095;</div>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <div id="footer-container"></div>

    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/gallery-data.js"></script>
    <script>
        let currentAlbum = null;
        let currentImageIdx = 0;

        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        const lbCounter = document.getElementById('lightbox-counter');

        function initAlbum() {
            const urlParams = new URLSearchParams(window.location.search);
            const albumId = urlParams.get('id');
            
            if (!albumId) {
                window.location.href = 'gallery.html';
                return;
            }

            currentAlbum = albumsData.find(a => a.id === albumId);
            
            if (!currentAlbum) {
                window.location.href = 'gallery.html';
                return;
            }

            document.title = `${currentAlbum.title} - Friends Florist`;
            document.getElementById('album-title').textContent = currentAlbum.title;

            // Add album-specific class to body for targeted CSS
            document.body.classList.add(`album-${albumId}`);
            
            renderImages();
        }

        function renderImages() {
            const grid = document.getElementById('image-grid');
            grid.innerHTML = '';
            
            currentAlbum.images.forEach((imgSrc, idx) => {
                const div = document.createElement('div');
                div.className = 'image-item';
                div.innerHTML = `<img src="${imgSrc}" loading="lazy" alt="${currentAlbum.title} Image ${idx + 1}">`;
                div.onclick = () => openLightbox(idx);
                grid.appendChild(div);
            });
        }

        function openLightbox(idx) {
            currentImageIdx = idx;
            updateLightboxView();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateLightboxView() {
            lbImg.src = currentAlbum.images[currentImageIdx];
            lbCounter.textContent = `${currentImageIdx + 1} / ${currentAlbum.images.length}`;
        }

        function changeImage(direction, event) {
            if (event) event.stopPropagation();
            currentImageIdx += direction;
            if (currentImageIdx < 0) currentImageIdx = currentAlbum.images.length - 1;
            if (currentImageIdx >= currentAlbum.images.length) currentImageIdx = 0;
            updateLightboxView();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
            lbImg.src = '';
        }

        lightbox.addEventListener('click', (e) => {
            if(e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'Escape') closeLightbox();
        });

        document.addEventListener('DOMContentLoaded', initAlbum);
    </script>
</body>
</html>
