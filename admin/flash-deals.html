<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Deals</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        florist: {
                            50: '#fff5f6',
                            100: '#ffebe0',
                            200: '#ffd1d6',
                            500: '#ff8a95',
                            600: '#e55b6a',
                            700: '#c23c4a',
                            800: '#8f232f',
                            DEFAULT: '#ff8a95'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>
    <!-- Main Content Container for admin-common.js to capture -->
    <div id="admin-content" class="space-y-6">
        <!-- Header Actions -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h2 class="text-xl font-bold text-gray-800 dark:text-white">Flash Deals & Promotions</h2>
                <p class="text-xs text-gray-400 mt-1">Configure active promotional banners and discounts shown on the homepage.</p>
            </div>
            <button onclick="openDealModal()" class="px-5 py-3 bg-rose-500 hover:bg-rose-600 active:scale-[0.98] text-white font-bold text-xs rounded-xl shadow-md shadow-rose-500/20 hover:shadow-lg transition-all flex items-center gap-2">
                ➕ <span>Create Flash Deal</span>
            </button>
        </div>

        <!-- Table Container -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-rose-100/40 dark:border-gray-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-rose-50/20 dark:bg-gray-750/40 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase border-b border-rose-50 dark:border-gray-700">
                            <th class="px-6 py-4">Image Banner</th>
                            <th class="px-6 py-4">Deal Title</th>
                            <th class="px-6 py-4">Discount Details</th>
                            <th class="px-6 py-4">Action URL</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="deals-table-body" class="divide-y divide-rose-50/30 dark:divide-gray-700">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-16 px-6">
                <div class="text-4xl mb-3">⚡</div>
                <h4 class="font-bold text-gray-700 dark:text-gray-300 text-sm">No promotional deals configured</h4>
                <p class="text-xs text-gray-400 mt-1">Create your first deal to display it dynamically on your storefront home banner!</p>
            </div>
        </div>

        <!-- Form Modal -->
        <div id="deal-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm">
            <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-xl border border-rose-100/40 dark:border-gray-700 p-6 w-full max-w-xl max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between border-b border-rose-50 dark:border-gray-700 pb-4 mb-6">
                    <h3 id="modal-title" class="font-bold text-gray-800 dark:text-white text-base">Add Flash Deal</h3>
                    <button onclick="closeDealModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl font-bold">✕</button>
                </div>

                <form id="deal-form" class="space-y-4">
                    <input type="hidden" id="edit-id">

                    <!-- Title -->
                    <div>
                        <label for="d-title" class="block text-xs font-semibold text-gray-500 uppercase mb-2">Deal Title *</label>
                        <input type="text" id="d-title" required placeholder="e.g. Special Anniversary Collection" class="w-full px-4 py-2.5 rounded-xl border border-rose-50 dark:border-gray-700 bg-rose-50/10 dark:bg-gray-750/30 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/40 text-gray-800 dark:text-gray-100">
                    </div>

                    <!-- Discount -->
                    <div>
                        <label for="d-discount" class="block text-xs font-semibold text-gray-500 uppercase mb-2">Discount Subtitle *</label>
                        <input type="text" id="d-discount" required placeholder="e.g. Get 20% off on all Anniversary Bouquets today!" class="w-full px-4 py-2.5 rounded-xl border border-rose-50 dark:border-gray-700 bg-rose-50/10 dark:bg-gray-750/30 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/40 text-gray-800 dark:text-gray-100">
                    </div>

                    <!-- Banner Image URL -->
                    <div>
                        <label for="d-image" class="block text-xs font-semibold text-gray-500 uppercase mb-2">Banner Image URL</label>
                        <input type="url" id="d-image" placeholder="https://images.unsplash.com/photo-... (Leave blank to use elegant rose pattern)" class="w-full px-4 py-2.5 rounded-xl border border-rose-50 dark:border-gray-700 bg-rose-50/10 dark:bg-gray-750/30 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/40 text-gray-800 dark:text-gray-100">
                    </div>

                    <!-- Link CTA -->
                    <div>
                        <label for="d-cta" class="block text-xs font-semibold text-gray-500 uppercase mb-2">Button Link URL</label>
                        <input type="text" id="d-cta" placeholder="e.g. shop.html?category=Anniversary%20Flowers" class="w-full px-4 py-2.5 rounded-xl border border-rose-50 dark:border-gray-700 bg-rose-50/10 dark:bg-gray-750/30 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/40 text-gray-800 dark:text-gray-100">
                    </div>

                    <!-- Form CTA -->
                    <div class="flex justify-end gap-3 pt-4 border-t border-rose-50 dark:border-gray-700 mt-6">
                        <button type="button" onclick="closeDealModal()" class="px-5 py-2.5 bg-rose-50 hover:bg-rose-100 dark:bg-gray-700 dark:hover:bg-gray-650 text-gray-600 dark:text-gray-300 font-semibold text-xs rounded-xl transition-all">Cancel</button>
                        <button type="submit" class="px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow-md shadow-rose-500/20 hover:shadow-lg transition-all">Save Deal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Admin Helper Logic and Common script -->
    <script src="js/admin-common.js"></script>
    <script>
        const fallbackBanner = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200&auto=format&fit=crop";

        document.addEventListener('DOMContentLoaded', () => {
            renderDealsTable();
        });

        // Renders active deals
        function renderDealsTable() {
            const deals = getDeals();
            const tableBody = document.getElementById('deals-table-body');
            const emptyState = document.getElementById('empty-state');

            tableBody.innerHTML = '';

            if (deals.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            deals.forEach(d => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-rose-50/10 dark:hover:bg-gray-750/30 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="w-24 h-12 rounded-lg overflow-hidden shadow-inner border border-rose-50 dark:border-gray-700 bg-rose-100/30 flex items-center justify-center font-bold text-xs text-rose-500">
                            ${d.image ? `<img src="${d.image}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='🌹 Patterns'">` : '🌹 Elegant Pattern'}
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="font-bold text-gray-800 dark:text-white text-sm">${d.title}</span>
                    </td>
                    <td class="px-6 py-4 text-xs font-semibold text-gray-600 dark:text-gray-300 max-w-xs truncate">${d.discount}</td>
                    <td class="px-6 py-4 font-mono text-2xs text-gray-400 select-all">${d.cta || 'shop.html'}</td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="editDeal(${d.id})" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 dark:bg-gray-700 dark:hover:bg-gray-650 text-rose-600 dark:text-rose-400 font-semibold text-2xs rounded-lg transition-colors">Edit</button>
                            <button onclick="deleteDeal(${d.id})" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 dark:bg-gray-700 dark:hover:bg-gray-650 text-rose-700 hover:text-red-600 font-semibold text-2xs rounded-lg transition-colors">Delete</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Deal Modal handlers
        function openDealModal(title = "Create Flash Deal", deal = null) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('deal-form').reset();
            document.getElementById('edit-id').value = '';

            if (deal) {
                document.getElementById('edit-id').value = deal.id;
                document.getElementById('d-title').value = deal.title;
                document.getElementById('d-discount').value = deal.discount;
                document.getElementById('d-image').value = deal.image || '';
                document.getElementById('d-cta').value = deal.cta || '';
            }

            document.getElementById('deal-modal').classList.remove('hidden');
        }

        function closeDealModal() {
            document.getElementById('deal-modal').classList.add('hidden');
        }

        // Form Submit
        document.getElementById('deal-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const title = document.getElementById('d-title').value.trim();
            const discount = document.getElementById('d-discount').value.trim();
            const image = document.getElementById('d-image').value.trim();
            const cta = document.getElementById('d-cta').value.trim();

            const deals = getDeals();

            if (editId) {
                // Edit
                const idx = deals.findIndex(d => d.id === parseInt(editId));
                if (idx !== -1) {
                    deals[idx] = {
                        ...deals[idx],
                        title,
                        discount,
                        image,
                        cta
                    };
                }
            } else {
                // Add new
                const newDeal = {
                    id: Date.now(),
                    title,
                    discount,
                    image,
                    cta
                };
                deals.push(newDeal);
            }

            // Maintain order (primary deal at Index 0)
            if (saveDeals(deals)) {
                closeDealModal();
                renderDealsTable();
            } else {
                alert('Error saving promotions.');
            }
        });

        // Edit trigger
        function editDeal(id) {
            const deals = getDeals();
            const d = deals.find(dl => dl.id === id);
            if (d) {
                openDealModal("Edit Flash Deal Info", d);
            }
        }

        // Delete trigger
        function deleteDeal(id) {
            const deals = getDeals();
            const d = deals.find(dl => dl.id === id);
            if (d && confirm(`Are you sure you want to delete the deal "${d.title}"? The home banner will immediately revert to its original default promotion.`)) {
                const filtered = deals.filter(dl => dl.id !== id);
                if (saveDeals(filtered)) {
                    renderDealsTable();
                } else {
                    alert('Error deleting promotion.');
                }
            }
        }
    </script>
</body>
</html>
