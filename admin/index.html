<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Friends Florist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        florist: {
                            50: '#fff5f6',
                            100: '#ffebe0',
                            200: '#ffd1d6',
                            500: '#ff8a95',
                            600: '#e55b6a',
                            700: '#c23c4a',
                            800: '#8f232f',
                            DEFAULT: '#ff8a95'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        h1 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-rose-100 via-rose-50/50 to-emerald-50 min-h-screen flex items-center justify-center p-4">
    <!-- Card Container -->
    <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-xl shadow-rose-100/50 border border-white/60 p-8 w-full max-w-md transition-all duration-300 hover:shadow-2xl hover:shadow-rose-100/70">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-full bg-rose-100 flex items-center justify-center text-3xl mx-auto mb-4 animate-bounce">🌹</div>
            <h1 class="text-3xl font-bold text-gray-800">Friends <span class="text-emerald-800 font-normal">Florist</span></h1>
            <p class="text-xs text-rose-500 font-semibold tracking-wider uppercase mt-1">Management Portal</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-6">
            <!-- Alert Section -->
            <div id="error-alert" class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-xs px-4 py-3 rounded-xl font-medium"></div>

            <!-- Email Input -->
            <div>
                <label for="email" class="block text-xs font-semibold text-gray-600 uppercase mb-2">Email Address</label>
                <input type="email" id="email" required placeholder="admin@friendsflorist.com" class="w-full px-4 py-3 rounded-xl border border-rose-100 focus:outline-none focus:ring-2 focus:ring-rose-500/50 focus:border-rose-500 bg-white/70 text-gray-800 text-sm placeholder-gray-400 transition-all">
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-xs font-semibold text-gray-600 uppercase mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-rose-100 focus:outline-none focus:ring-2 focus:ring-rose-500/50 focus:border-rose-500 bg-white/70 text-gray-800 text-sm placeholder-gray-400 transition-all">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 active:scale-[0.98] text-white font-bold rounded-xl shadow-lg shadow-rose-500/20 hover:shadow-xl hover:shadow-rose-600/30 transition-all duration-200 text-sm flex items-center justify-center gap-2">
                🔒 <span>Sign In</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-8 pt-6 border-t border-rose-50">
            <a href="../index.html" class="text-xs text-rose-600 hover:text-rose-700 font-semibold flex items-center justify-center gap-1.5 transition-colors">
                ← <span>Back to Main Website</span>
            </a>
        </div>
    </div>

    <!-- Login Controller -->
    <script src="js/admin-common.js"></script>
    <script>
        // Redirect to dashboard immediately if already authenticated
        if (localStorage.getItem('ff_admin_auth') === 'true') {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('error-alert');

            alertBox.classList.add('hidden');

            if (email === 'admin@friendsflorist.com' && password === 'Friends@123') {
                localStorage.setItem('ff_admin_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                alertBox.textContent = 'Invalid email address or password. Please try again.';
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
