<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Friends Florist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/floral-theme.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .auth-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-color: var(--color-bg-gray);
        }

        .auth-card {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--color-border);
        }

        .auth-tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--color-text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fdfdfd;
        }

        .auth-tab.active {
            color: var(--color-dark-green);
            background: white;
            position: relative;
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--color-dark-green);
        }

        .auth-body {
            padding: 40px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .form-title p {
            color: var(--color-text-light);
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-main);
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--color-dark-green);
            box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.1);
        }

        .auth-btn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
        }

        .form-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--color-text-light);
        }

        .form-footer a {
            color: var(--color-dark-green);
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" href="css/android-fixes.css">

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
    
    <!-- Navbar Component Container -->
    <div id="navbar-container"></div>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchAuth('login')">Login</div>
                <div class="auth-tab" id="tab-register" onclick="switchAuth('register')">Register</div>
            </div>

            <div class="auth-body">
                <!-- Login Form -->
                <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                    <div class="form-title">
                        <h2>Welcome Back</h2>
                        <p>Sign in to your Friends Florist account</p>
                    </div>

                    <!-- Inline error message -->
                    <div id="login-error" style="display:none; background:#fef2f2; color:#c0392b; padding:10px 14px; border-radius:8px; font-size:0.9rem; margin-bottom:16px;"></div>
                    
                    <div class="input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="email@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>

                    <div style="text-align: right; margin-bottom: 20px;">
                        <a href="#" style="font-size: 0.85rem; color: var(--color-text-light);">Forgot Password?</a>
                    </div>

                    <button type="submit" id="login-btn" data-label="Secure Login" class="btn btn-primary auth-btn">Secure Login</button>

                    <div class="form-footer">
                        Don't have an account? <a href="javascript:void(0)" onclick="switchAuth('register')">Register here</a>
                    </div>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                    <div class="form-title">
                        <h2>Join Our Community</h2>
                        <p>Create an account for exclusive floral deals</p>
                    </div>

                    <!-- Inline error message -->
                    <div id="register-error" style="display:none; background:#fef2f2; color:#c0392b; padding:10px 14px; border-radius:8px; font-size:0.9rem; margin-bottom:16px;"></div>

                    <div class="input-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" placeholder="John Doe" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" placeholder="email@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-phone">Phone Number <span style="color:var(--color-text-light);font-weight:400;">(optional)</span></label>
                        <input type="tel" id="reg-phone" placeholder="+91 98765 43210">
                    </div>

                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="At least 6 characters" required>
                    </div>

                    <div class="input-group" style="display: flex; gap: 10px; align-items: flex-start;">
                        <input type="checkbox" id="terms" style="width: auto; margin-top: 4px;" required>
                        <label for="terms" style="font-size: 0.8rem; font-weight: 400; color: var(--color-text-light);">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" id="register-btn" data-label="Create Account" class="btn btn-primary auth-btn">Create Account</button>

                    <div class="form-footer">
                        Already have an account? <a href="javascript:void(0)" onclick="switchAuth('login')">Login here</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Component Container -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="js/api-client.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
        // ── Constants ──────────────────────────────────────────────────────────
        const API_BASE = 'https://floristbackend.onrender.com/api';
        const USER_KEY  = 'ff_user';
        const TOKEN_KEY = 'ff_user_token';

        // ── Redirect if already logged in ──────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem(TOKEN_KEY);
            if (token) {
                const returnUrl = new URLSearchParams(window.location.search).get('return') || 'index.html';
                window.location.href = returnUrl;
            }

            // Auto-switch tab if URL has ?tab=register
            const tab = new URLSearchParams(window.location.search).get('tab');
            if (tab === 'register') switchAuth('register');
        });

        // ── Tab switch ─────────────────────────────────────────────────────────
        function switchAuth(type) {
            document.getElementById('login-form').classList.toggle('active', type === 'login');
            document.getElementById('register-form').classList.toggle('active', type === 'register');
            document.getElementById('tab-login').classList.toggle('active', type === 'login');
            document.getElementById('tab-register').classList.toggle('active', type === 'register');
            // Clear errors when switching
            document.getElementById('login-error').textContent = '';
            document.getElementById('register-error').textContent = '';
        }

        // ── Show inline error ──────────────────────────────────────────────────
        function showError(elId, message) {
            const el = document.getElementById(elId);
            if (el) { el.textContent = message; el.style.display = 'block'; }
        }

        // ── Set button loading state ───────────────────────────────────────────
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.disabled = loading;
            btn.textContent = loading ? 'Please wait...' : btn.dataset.label;
        }

        // ── Save session to localStorage ───────────────────────────────────────
        function saveSession(token, user) {
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(USER_KEY, JSON.stringify(user));
        }

        // ── Handle Login ───────────────────────────────────────────────────────
        async function handleLogin(event) {
            event.preventDefault();
            showError('login-error', '');
            setLoading('login-btn', true);

            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError('login-error', data.message || 'Login failed. Please try again.');
                    setLoading('login-btn', false);
                    return;
                }

                saveSession(data.token, data.user);
                showToast(`Welcome back, ${data.user.name}! 🌸`, 'success', 'Login Successful');

                setTimeout(() => {
                    const returnUrl = new URLSearchParams(window.location.search).get('return') || 'index.html';
                    window.location.href = returnUrl;
                }, 1000);

            } catch (err) {
                showError('login-error', 'Network error. Please check your connection.');
                setLoading('login-btn', false);
            }
        }

        // ── Handle Register ────────────────────────────────────────────────────
        async function handleRegister(event) {
            event.preventDefault();
            showError('register-error', '');
            setLoading('register-btn', true);

            const name     = document.getElementById('reg-name').value.trim();
            const email    = document.getElementById('reg-email').value.trim();
            const phone    = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;

            if (password.length < 6) {
                showError('register-error', 'Password must be at least 6 characters.');
                setLoading('register-btn', false);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError('register-error', data.message || 'Registration failed. Please try again.');
                    setLoading('register-btn', false);
                    return;
                }

                saveSession(data.token, data.user);
                showToast(`Welcome to Friends Florist, ${data.user.name}! 🌸`, 'success', 'Account Created');

                setTimeout(() => {
                    const returnUrl = new URLSearchParams(window.location.search).get('return') || 'index.html';
                    window.location.href = returnUrl;
                }, 1000);

            } catch (err) {
                showError('register-error', 'Network error. Please check your connection.');
                setLoading('register-btn', false);
            }
        }
    </script>
</body>
</html>
