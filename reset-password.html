<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Friends Florist</title>
    <meta name="description" content="Create a new password for your Friends Florist account.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/floral-theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/android-fixes.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <style>
        .auth-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-color: var(--color-bg-gray);
        }

        .auth-card {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out;
        }

        .auth-header {
            background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
            padding: 32px 40px;
            text-align: center;
        }

        .auth-header .flower-icon { font-size: 2.5rem; margin-bottom: 10px; }

        .auth-header h1 {
            margin: 0;
            color: #fff;
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 700;
        }

        .auth-header p {
            margin: 6px 0 0;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        .auth-body { padding: 40px; }

        .input-group { margin-bottom: 20px; }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-main);
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: var(--color-dark-green);
            box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.1);
        }

        .auth-btn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
        }

        .success-state { text-align: center; }

        .success-state .check-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #2d6a4f, #1b4332);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        .success-state h2 { margin: 0 0 10px; font-size: 1.5rem; }

        .success-state p { color: var(--color-text-light); font-size: 0.95rem; margin: 0 0 24px; }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="flower-icon">🌸</div>
                <h1>New Password</h1>
                <p>Create a strong password for your account</p>
            </div>

            <div class="auth-body">
                <!-- Error message -->
                <div id="reset-error" style="display:none; background:#fef2f2; color:#c0392b; padding:10px 14px; border-radius:8px; font-size:0.9rem; margin-bottom:16px;"></div>

                <!-- Reset Form -->
                <form id="reset-form" onsubmit="handleReset(event)">
                    <div class="input-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="At least 6 characters" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Re-enter your password" required>
                    </div>

                    <button type="submit" id="reset-btn" data-label="Update Password" class="btn btn-primary auth-btn">
                        Update Password
                    </button>
                </form>

                <!-- Success State (hidden initially) -->
                <div id="success-state" class="success-state" style="display:none;">
                    <div class="check-circle">✓</div>
                    <h2>Password Updated!</h2>
                    <p>Your password has been changed successfully. You can now log in with your new password.</p>
                    <a href="auth.html" class="btn btn-primary auth-btn" style="display:inline-block; text-decoration:none; text-align:center;">
                        Go to Login
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/api-client.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
        const API_BASE  = 'https://floristbackend.onrender.com/api';
        const TOKEN_KEY = 'ff_user_token';

        // Get reset token from URL
        const resetToken = new URLSearchParams(window.location.search).get('token');

        // Redirect to login if no token provided
        if (!resetToken) {
            window.location.href = 'auth.html';
        }

        function showError(message) {
            const el = document.getElementById('reset-error');
            el.textContent = message;
            el.style.display = message ? 'block' : 'none';
        }

        function setLoading(loading) {
            const btn = document.getElementById('reset-btn');
            if (!btn) return;
            btn.disabled = loading;
            btn.textContent = loading ? 'Please wait...' : btn.dataset.label;
        }

        async function handleReset(event) {
            event.preventDefault();
            showError('');

            const password = document.getElementById('new-password').value;
            const confirm  = document.getElementById('confirm-password').value;

            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            if (password !== confirm) {
                showError('Passwords do not match.');
                return;
            }

            setLoading(true);

            try {
                const res  = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.message || 'Reset failed. The link may have expired.');
                    setLoading(false);
                    return;
                }

                // Show success state
                document.getElementById('reset-form').style.display  = 'none';
                document.getElementById('success-state').style.display = 'block';

            } catch (err) {
                showError('Network error. Please check your connection.');
                setLoading(false);
            }
        }
    </script>
</body>
</html>
