<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Friends Florist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/floral-theme.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .page-header {
            padding: 100px 0 40px;
            text-align: center;
        }
        .checkout-container {
            display: flex;
            gap: 40px;
            padding-bottom: 80px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .checkout-form-area {
            flex: 1.5;
            background: white;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .checkout-summary-area {
            flex: 1;
            background: var(--color-light-pink);
            padding: 30px;
            border-radius: var(--border-radius);
            height: fit-content;
        }
        
        /* Form Styles */
        .form-section {
            margin-bottom: 40px;
        }
        .form-section h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group.full {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-main);
        }
        .form-group input {
            padding: 12px 15px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: var(--color-dark-green);
        }

        /* (Razorpay Checkout SDK handles the payment popup natively) */

        /* Order Items Mini List */
        .mini-cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.95rem;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            padding-bottom: 10px;
        }
        .mini-cart-item span:first-child {
            flex: 1;
            padding-right: 10px;
        }

        .btn-location-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            background: white;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            color: var(--color-text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-location-icon:hover {
            background: #f0fdf4;
            border-color: var(--color-dark-green);
            color: var(--color-dark-green);
        }
        .btn-location-icon.loading svg {
            animation: pulse-icon 1s infinite;
            color: var(--color-dark-green);
        }
        @keyframes pulse-icon {
            0% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.85); opacity: 0.6; }
        }

        @media (max-width: 900px) {
            .checkout-container {
                flex-direction: column-reverse;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="css/android-fixes.css">

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    
    <div id="navbar-container"></div>

    <main>
        <header class="page-header">
            <h1 class="section-title">Secure Checkout</h1>
        </header>

        <section class="container checkout-container">
            <div class="checkout-form-area">
                <form id="checkout-form" onsubmit="event.preventDefault(); openRazorpay();">
                    
                    <div class="form-section">
                        <h3>Customer Details</h3>
                        <div class="form-grid">
                            <div class="form-group full">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address (Optional)</label>
                                <input type="email" id="email" placeholder="john@example.com">
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" required placeholder="123-456-7890">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div style="margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 10px;">
                            <h3 style="margin: 0; border: none; padding: 0;">Delivery Address</h3>
                        </div>
                        <div class="form-grid">
                            <div class="form-group full">
                                <label for="address">Street Address</label>
                                <input type="text" id="address" required placeholder="123 Floral Street, Apt 4B">
                            </div>
                            <div class="form-group">
                                <label for="landmark">Landmark</label>
                                <input type="text" id="landmark" required placeholder="Near Apollo Hospital">
                            </div>
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" required placeholder="Hyderabad" value="Hyderabad">
                            </div>
                            <div class="form-group">
                                <label for="pincode">Pincode</label>
                                <div style="display: flex; gap: 8px;">
                                    <input type="text" id="pincode" required placeholder="500029" style="flex: 1;">
                                    <button type="button" class="btn-location-icon" id="loc-btn" onclick="useCurrentLocation()" title="Detect Current Location" style="width: auto; padding: 0 15px; font-size: 0.85rem; font-weight: 500; gap: 6px;">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                                        </svg>
                                        Locate to continue payment
                                    </button>
                                </div>
                            </div>
                            <div class="form-group full" id="delivery-status-container" style="display:none; padding: 12px; border-radius: 6px; background: #f8f9fa; border: 1px solid #e9ecef; margin-top: 5px;">
                                <div id="delivery-status-text" style="font-size: 0.95rem; font-weight: 500;">Calculating delivery...</div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Payment Option</h3>
                        <p style="color: var(--color-text-light); font-size: 0.9rem; margin-bottom: 15px;">
                            Click below to securely pay via Razorpay.
                        </p>
                        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 15px;">Pay Securely Now</button>
                        <p style="text-align: center; margin-top: 15px; cursor: pointer; color: var(--color-text-light); text-decoration: underline;" onclick="processCOD()">Or pay via Cash on Delivery</p>
                    </div>

                </form>
            </div>

            <div class="checkout-summary-area">
                <h3 style="font-size: 1.3rem; margin-bottom: 20px;">Order Summary</h3>
                <div id="checkout-items-list" style="margin-bottom: 25px;">
                    <!-- Parsed via JS -->
                </div>
                
                <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
                    <span>Subtotal</span><span id="chk-subtotal">₹0</span>
                </div>
                <div style="display:none; justify-content:space-between; margin-bottom: 10px;">
                    <span>Tax</span><span id="chk-tax">₹0</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                    <span>Delivery</span><span id="chk-delivery">₹0</span>
                </div>
                
                <!-- Coupon Section -->
                <div class="coupon-section" style="margin: 20px 0; border-top: 1px solid var(--color-border); padding-top: 20px;">
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="coupon-input" placeholder="Enter Coupon Code" style="flex: 1; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px; text-transform: uppercase;">
                        <button type="button" class="btn btn-secondary" id="coupon-btn" onclick="applyCoupon()" style="padding: 10px 20px;">Apply</button>
                    </div>
                    <div id="coupon-message" style="margin-top: 8px; font-size: 0.85rem;"></div>
                </div>
                
                <div style="display:none; justify-content:space-between; margin-bottom: 10px; color: var(--color-dark-green);" id="discount-row">
                    <span>Discount (<span id="applied-coupon-code"></span>)</span><span id="chk-discount">-₹0</span>
                </div>
                
                <div style="display:flex; justify-content:space-between; font-size: 1.4rem; font-weight: bold; border-top: 2px solid var(--color-border); padding-top: 15px;">
                    <span>Total</span><span id="chk-total">₹0</span>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="js/api-client.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js?v=2.2.0"></script>
    <script src="js/app.js"></script>
    <script>
        const SHOP_LAT = 17.4043;
        const SHOP_LNG = 78.4823;
        let finalTotalAmount = 0;
        let calculatedDeliveryCharge = 0;
        let isDeliverable = false;
        let locationCalculated = false;

        // Coupon Logic
        let appliedCoupon = null;
        let discountAmount = 0;
        
        async function applyCoupon() {
            const input = document.getElementById('coupon-input');
            const code = input.value.trim().toUpperCase();
            const msgEl = document.getElementById('coupon-message');
            const btn = document.getElementById('coupon-btn');
            
            if (!code) return;

            btn.textContent = 'Applying...';
            btn.disabled = true;
            msgEl.innerHTML = '';

            try {
                const subtotal = getCartTotal().subtotal;
                const API_BASE = (typeof window.API_BASE_URL !== 'undefined') ? window.API_BASE_URL : 'https://floristbackend.onrender.com/api';
                
                const response = await fetch(`${API_BASE}/orders/validate-coupon`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, subtotal })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    appliedCoupon = result.data;
                    localStorage.setItem('friendsFloristCoupon', JSON.stringify(appliedCoupon));
                    
                    msgEl.innerHTML = `<span style="color: #27ae60; font-weight: 500;">✓ ${result.data.message || 'Coupon Applied'}</span>`;
                    showToast(`Coupon ${code} applied successfully`, 'success', 'Coupon Applied');
                    
                    input.value = code;
                    input.disabled = true;
                    
                    btn.textContent = 'Remove';
                    btn.disabled = false;
                    btn.onclick = removeCoupon;
                    
                    updateCheckoutTotals();
                } else {
                    throw new Error(result.message || 'Invalid coupon code');
                }
            } catch (error) {
                msgEl.innerHTML = `<span style="color: #e74c3c; font-weight: 500;">✕ ${error.message}</span>`;
                showToast(error.message, 'error', 'Coupon Error');
                btn.textContent = 'Apply';
                btn.disabled = false;
            }
        }
        
        function removeCoupon() {
            appliedCoupon = null;
            localStorage.removeItem('friendsFloristCoupon');
            
            const input = document.getElementById('coupon-input');
            input.value = '';
            input.disabled = false;
            
            const btn = document.getElementById('coupon-btn');
            btn.textContent = 'Apply';
            btn.onclick = applyCoupon;
            
            document.getElementById('coupon-message').innerHTML = '';
            
            updateCheckoutTotals();
            showToast('Coupon removed', 'info', 'Coupon Removed');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (cart.length === 0) {
                openModal({
                    title: 'Empty Cart',
                    message: 'Your cart is empty. Redirecting to shop.',
                    type: 'info',
                    onConfirm: () => { window.location.href = 'shop.html'; },
                    onCancel: () => { window.location.href = 'shop.html'; }
                });
                return;
            }

            renderInitialCart();
            updateCheckoutTotals();

            // Load saved coupon
            const savedCoupon = JSON.parse(localStorage.getItem('friendsFloristCoupon'));
            if (savedCoupon && savedCoupon.code) {
                const input = document.getElementById('coupon-input');
                if (input) {
                    input.value = savedCoupon.code;
                    applyCoupon();
                }
            }
        });

        function renderInitialCart() {
            const container = document.getElementById('checkout-items-list');
            let html = '';
            
            cart.forEach(item => {
                html += `
                    <div class="mini-cart-item">
                        <span>${item.name} (x${item.quantity})</span>
                        <span>₹${(item.price * item.quantity).toLocaleString('en-IN')}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Distance Calculation (Haversine Formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = (lat2 - lat1) * Math.PI / 180;  
            const dLon = (lon2 - lon1) * Math.PI / 180; 
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; 
        }

        // Pricing Rules
        function getDeliveryPricing(distance) {
            if (distance <= 5) return 60;
            if (distance <= 10) return 100;
            if (distance <= 20) return 180;
            return -1; // Not deliverable
        }

        // Nominatim Geocoding
        async function geocodeAddress(pincode, landmark) {
            try {
                let url = `https://nominatim.openstreetmap.org/search?format=json&country=India&limit=1`;
                if (landmark) {
                    url += `&q=${encodeURIComponent(landmark + ' ' + pincode)}`;
                } else {
                    url += `&postalcode=${encodeURIComponent(pincode)}`;
                }
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                }
                return null;
            } catch (error) {
                console.error("Geocoding error:", error);
                return null;
            }
        }

        async function calculateDelivery() {
            const pincode = document.getElementById('pincode').value.trim();
            const landmark = document.getElementById('landmark').value.trim();
            const statusContainer = document.getElementById('delivery-status-container');
            const statusText = document.getElementById('delivery-status-text');
            
            if (!pincode) return;

            statusContainer.style.display = 'block';
            statusText.textContent = 'Calculating delivery distance...';
            statusText.style.color = '#666';

            let coords = await geocodeAddress(pincode, landmark);
            let isHydPincode = pincode.startsWith('500') && pincode.length >= 6;

            if (coords) {
                processCoordinates(coords.lat, coords.lng, isHydPincode);
            } else {
                statusText.textContent = 'Unable to detect location for this pincode.';
                statusText.style.color = '#d9534f';
                isDeliverable = false;
                locationCalculated = false;
                updateCheckoutTotals();
            }
        }

        function useCurrentLocation() {
            const locBtn = document.getElementById('loc-btn');
            const statusContainer = document.getElementById('delivery-status-container');
            const statusText = document.getElementById('delivery-status-text');
            
            if (navigator.geolocation) {
                if (locBtn) locBtn.classList.add('loading');
                statusContainer.style.display = 'block';
                statusText.textContent = 'Detecting precise location...';
                statusText.style.color = '#666';

                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                            const data = await res.json();
                            if (data && data.address) {
                                if (data.address.postcode) {
                                    document.getElementById('pincode').value = data.address.postcode;
                                }
                                if (data.address.road || data.address.suburb) {
                                    let addy = `${data.address.road || ''} ${data.address.suburb || ''}`.trim();
                                    if (addy) document.getElementById('address').value = addy;
                                }
                            }
                        } catch(e) { console.error('Reverse geocode failed', e); }

                        if (locBtn) locBtn.classList.remove('loading');
                        processCoordinates(lat, lng, false);
                    },
                    (error) => {
                        if (locBtn) locBtn.classList.remove('loading');
                        statusText.textContent = 'Unable to get your location. Please enter pincode manually.';
                        statusText.style.color = '#d9534f';
                    }
                );
            } else {
                showToast("Geolocation is not supported by this browser.", "error", "Error");
            }
        }

        function processCoordinates(lat, lng, isHydPincode = false) {
            const statusText = document.getElementById('delivery-status-text');
            const distance = calculateDistance(SHOP_LAT, SHOP_LNG, lat, lng);
            const price = getDeliveryPricing(distance);

            locationCalculated = true;
            let prefix = isHydPincode ? "Hyderabad service area detected. " : "";

            if (price === -1) {
                statusText.textContent = `${prefix}Distance: ${distance.toFixed(1)} km. Sorry, we do not deliver beyond 20 km.`;
                statusText.style.color = '#d9534f';
                isDeliverable = false;
                calculatedDeliveryCharge = 0;
            } else {
                statusText.textContent = `${prefix}Distance: ${distance.toFixed(1)} km. Delivery Charge: ₹${price}`;
                statusText.style.color = '#28a745';
                isDeliverable = true;
                calculatedDeliveryCharge = price;
            }

            updateCheckoutTotals();
        }

        function updateCheckoutTotals() {
            const totals = getCartTotal(); 
            const subtotal = totals.subtotal;
            const tax = totals.tax;
            
            let displayDeliveryFee = locationCalculated ? calculatedDeliveryCharge : 0;
            let actualDeliveryFee = displayDeliveryFee;
            
            discountAmount = 0;
            if (appliedCoupon) {
                if (appliedCoupon.type === 'percent') {
                    discountAmount = subtotal * (appliedCoupon.value / 100);
                } else if (appliedCoupon.type === 'fixed') {
                    discountAmount = appliedCoupon.value;
                } else if (appliedCoupon.type === 'free_delivery') {
                    actualDeliveryFee = 0;
                }
                
                // Ensure discount doesn't exceed subtotal
                if (appliedCoupon.type !== 'free_delivery' && discountAmount > subtotal) discountAmount = subtotal;
                
                if (appliedCoupon.type !== 'free_delivery') {
                    document.getElementById('discount-row').style.display = 'flex';
                    document.getElementById('applied-coupon-code').textContent = appliedCoupon.code;
                    document.getElementById('chk-discount').textContent = `-₹${discountAmount.toLocaleString('en-IN')}`;
                } else {
                    document.getElementById('discount-row').style.display = 'none';
                }
            } else {
                document.getElementById('discount-row').style.display = 'none';
            }

            const newTotal = subtotal + tax + actualDeliveryFee - discountAmount;
            finalTotalAmount = newTotal > 0 ? newTotal : 0;

            document.getElementById('chk-subtotal').textContent = `₹${subtotal.toLocaleString('en-IN')}`;
            document.getElementById('chk-tax').textContent = `₹${tax.toLocaleString('en-IN')}`;
            
            if (!locationCalculated) {
                document.getElementById('chk-delivery').textContent = 'Enter address...';
            } else {
                if (appliedCoupon && appliedCoupon.type === 'free_delivery' && isDeliverable) {
                    document.getElementById('chk-delivery').innerHTML = `<del style="color: #999; margin-right: 8px;">₹${displayDeliveryFee.toLocaleString('en-IN')}</del> <span style="color: #27ae60; font-weight: bold;">Free</span>`;
                } else {
                    document.getElementById('chk-delivery').textContent = isDeliverable ? `₹${actualDeliveryFee.toLocaleString('en-IN')}` : 'Not Deliverable';
                }
            }
            
            document.getElementById('chk-total').textContent = `₹${finalTotalAmount.toLocaleString('en-IN')}`;

            const payBtn = document.querySelector('button[type="submit"]');
            const codBtn = document.querySelector('p[onclick="processCOD()"]');
            
            if (!isDeliverable || !locationCalculated) {
                payBtn.disabled = true;
                payBtn.style.opacity = '0.5';
                payBtn.style.cursor = 'not-allowed';
                codBtn.style.pointerEvents = 'none';
                codBtn.style.opacity = '0.5';
            } else {
                payBtn.disabled = false;
                payBtn.style.opacity = '1';
                payBtn.style.cursor = 'pointer';
                codBtn.style.pointerEvents = 'auto';
                codBtn.style.opacity = '1';
            }
        }

        async function openRazorpay() {
            if (!document.getElementById('checkout-form').checkValidity()) {
                document.getElementById('checkout-form').reportValidity();
                return;
            }
            if (!locationCalculated || !isDeliverable) {
                showToast('Please provide a valid delivery location within 20km.', 'error', 'Location Error');
                return;
            }

            // ── Collect form data ──────────────────────────────────────────────
            const customerName    = document.getElementById('name').value.trim();
            const customerEmail   = document.getElementById('email').value.trim();
            const customerPhone   = document.getElementById('phone').value.trim();
            const address         = document.getElementById('address').value.trim();
            const city            = (document.getElementById('city').value.trim()) || 'Hyderabad';
            const pincode         = document.getElementById('pincode').value.trim();
            const landmark        = document.getElementById('landmark').value.trim();
            const deliveryAddress = [address, landmark, city, pincode].filter(Boolean).join(', ');

            const payBtn = document.querySelector('button[type="submit"]');
            payBtn.disabled    = true;
            payBtn.textContent = 'Creating Order…';

            const API_BASE = (typeof window.API_BASE_URL !== 'undefined')
                ? window.API_BASE_URL
                : 'https://floristbackend.onrender.com/api';

            try {
                // ── Step 1: Create Razorpay order on backend ───────────────────
                const createRes = await fetch(`${API_BASE}/payment/create-order`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({
                        amount:        finalTotalAmount,
                        customerName,
                        customerEmail,
                        customerPhone,
                    })
                });

                if (!createRes.ok) {
                    const err = await createRes.json().catch(() => ({}));
                    throw new Error(err.message || 'Failed to create payment order.');
                }

                const orderData = await createRes.json();

                // ── Step 2: Open real Razorpay checkout popup ──────────────────
                const rzpOptions = {
                    key:         orderData.keyId,
                    amount:      orderData.amount,      // already in paise
                    currency:    orderData.currency,
                    name:        'Friends Florist',
                    description: 'Floral Arrangement Order',
                    image:       '/favicon-32x32.png',
                    order_id:    orderData.razorpayOrderId,
                    prefill: {
                        name:    customerName,
                        email:   customerEmail,
                        contact: customerPhone,
                    },
                    theme: { color: '#2d5016' },

                    // ── Step 3: On payment success ─────────────────────────────
                    handler: async function (response) {
                        try {
                            const items = cart.map(item => ({
                                product:  item._id || item.id || null,
                                name:     item.name,
                                image:    item.image || '',
                                quantity: item.quantity,
                                price:    item.price,
                            }));

                            const userToken = localStorage.getItem('ff_user_token');
                            const hdrs = { 'Content-Type': 'application/json' };
                            if (userToken) hdrs['Authorization'] = `Bearer ${userToken}`;

                            // ── Step 4: Verify signature + save order ──────────
                            const verifyRes = await fetch(`${API_BASE}/payment/verify`, {
                                method:  'POST',
                                headers: hdrs,
                                body:    JSON.stringify({
                                    razorpay_order_id:   response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature:  response.razorpay_signature,
                                    customerName,
                                    customerPhone,
                                    customerEmail,
                                    deliveryAddress,
                                    items,
                                    totalAmount: finalTotalAmount,
                                })
                            });

                            const verifyData = await verifyRes.json();

                            if (verifyData.success) {
                                // ── Step 5: Persist locally + redirect ────────
                                const orderId = (verifyData.data && verifyData.data.orderId)
                                    ? verifyData.data.orderId
                                    : 'ORD-' + Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
                                const localOrder = {
                                    id:               orderId,
                                    backendId:        verifyData.data?._id || null,
                                    date:             new Date().toLocaleDateString(),
                                    customer:         customerName,
                                    items:            cart,
                                    total:            finalTotalAmount,
                                    discount:         discountAmount,
                                    coupon:           appliedCoupon ? appliedCoupon.code : null,
                                    deliveryCharge:   calculatedDeliveryCharge,
                                    method:           'Razorpay',
                                    status:           'processing',
                                    razorpayPaymentId: response.razorpay_payment_id,
                                };

                                let orders = JSON.parse(localStorage.getItem('friendsFloristOrders')) || [];
                                orders.unshift(localOrder);
                                localStorage.setItem('friendsFloristOrders', JSON.stringify(orders));
                                localStorage.removeItem('friendsFloristCoupon');
                                localStorage.removeItem('friendsFloristCart');

                                window.location.href = 'confirmation.html?method=Razorpay&id=' + encodeURIComponent(orderId);
                            } else {
                                showToast('Payment verification failed. Please contact support.', 'error', 'Verification Failed');
                                payBtn.disabled    = false;
                                payBtn.textContent = 'Pay Securely Now';
                            }
                        } catch (verifyErr) {
                            console.error('[verify]', verifyErr);
                            showToast('Error verifying payment. Please contact support with your payment ID: ' + response.razorpay_payment_id, 'error', 'Error');
                            payBtn.disabled    = false;
                            payBtn.textContent = 'Pay Securely Now';
                        }
                    },

                    modal: {
                        ondismiss: function () {
                            payBtn.disabled    = false;
                            payBtn.textContent = 'Pay Securely Now';
                            showToast('Payment cancelled.', 'info', 'Payment');
                        }
                    }
                };

                const rzp = new window.Razorpay(rzpOptions);

                rzp.on('payment.failed', function (resp) {
                    showToast(`Payment failed: ${resp.error.description}`, 'error', 'Payment Failed');
                    payBtn.disabled    = false;
                    payBtn.textContent = 'Pay Securely Now';
                });

                rzp.open();

            } catch (err) {
                console.error('[openRazorpay]', err);
                showToast(err.message || 'Failed to initiate payment. Please try again.', 'error', 'Error');
                payBtn.disabled    = false;
                payBtn.textContent = 'Pay Securely Now';
            }
        }

        async function saveOrder(method) {
            // ─── 1. Collect form data ─────────────────────────────────────────────────
            const customerName    = (document.getElementById('name').value    || '').trim();
            const customerEmail   = (document.getElementById('email').value   || '').trim();
            const customerPhone   = (document.getElementById('phone').value   || '').trim();
            const address         = (document.getElementById('address').value || '').trim();
            const city            = (document.getElementById('city').value    || 'Hyderabad').trim();
            const pincode         = (document.getElementById('pincode').value || '').trim();
            const landmark        = (document.getElementById('landmark').value|| '').trim();

            const deliveryAddress = [address, landmark, city, pincode].filter(Boolean).join(', ');

            // ─── 2. Build items array for backend ────────────────────────────────────
            const items = cart.map(item => ({
                product:  item._id || item.id || null,
                name:     item.name,
                image:    item.image || '',
                quantity: item.quantity,
                price:    item.price
            }));

            // Phone fallback: if checkout form has no phone, use the logged-in user's phone
            const userSession = JSON.parse(localStorage.getItem('ff_user') || '{}');
            const resolvedPhone = customerPhone || userSession.phone || '';

            // ─── 3. Generate local order ID & build the order object ─────────────────
            const tempOrderId = 'ORD-' + Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
            const orderDate   = new Date().toLocaleDateString();

            const localOrder = {
                id: tempOrderId,
                date: orderDate,
                customer: customerName,
                items: cart,
                total: finalTotalAmount,
                discount: discountAmount,
                coupon: appliedCoupon ? appliedCoupon.code : null,
                deliveryCharge: calculatedDeliveryCharge,
                method: method,
                status: method === 'Cash on Delivery' ? 'received' : 'processing',
                deliveryDetails: { name: customerName, email: customerEmail, phone: customerPhone }
            };

            // ─── 4. Save to localStorage (always, as fallback) ───────────────────────
            let orders = JSON.parse(localStorage.getItem('friendsFloristOrders')) || [];
            orders.unshift(localOrder);
            localStorage.setItem('friendsFloristOrders', JSON.stringify(orders));
            localStorage.removeItem('friendsFloristCoupon');
            localStorage.removeItem('friendsFloristCart');

            let finalOrderId = tempOrderId;

            // ─── 5. POST to backend API ──────────────────────────────────────────────
            try {
                const apiPayload = {
                    customerName,
                    customerEmail,
                    customerPhone: resolvedPhone,
                    deliveryAddress,
                    items,
                    totalAmount: finalTotalAmount,
                    paymentStatus: method === 'Cash on Delivery' ? 'pending' : 'paid'
                };

                const API_BASE = (typeof window.API_BASE_URL !== 'undefined')
                    ? window.API_BASE_URL
                    : 'https://floristbackend.onrender.com/api';

                // Attach JWT if user is logged in — links order to account
                const userToken = localStorage.getItem('ff_user_token');
                const headers = { 'Content-Type': 'application/json' };
                if (userToken) headers['Authorization'] = `Bearer ${userToken}`;

                const response = await fetch(`${API_BASE}/orders`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(apiPayload)
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Order saved to backend:', data);
                    // Update the local order with the backend-assigned sequential orderId and _id
                    if (data.data) {
                        const backendDbId = data.data._id || null;
                        const backendSeqId = data.data.orderId || tempOrderId;

                        localOrder.backendId = backendDbId;
                        localOrder.id = backendSeqId;
                        finalOrderId = backendSeqId;

                        // Update the already-saved localStorage entry
                        orders[0].backendId = backendDbId;
                        orders[0].id = backendSeqId;
                        localStorage.setItem('friendsFloristOrders', JSON.stringify(orders));
                    }
                } else {
                    const err = await response.json().catch(() => ({}));
                    console.warn('⚠️ Backend order save failed:', err.message || response.status);
                    // Order is already in localStorage — user can still see it
                }
            } catch (err) {
                console.warn('⚠️ Network error saving order to backend:', err.message);
                // localStorage already saved — graceful degradation
            }

            window.location.href = 'confirmation.html?method=' + encodeURIComponent(method) + '&id=' + encodeURIComponent(finalOrderId);
        }


        async function processCOD() {
            if(!document.getElementById('checkout-form').checkValidity()) {
                document.getElementById('checkout-form').reportValidity();
                return;
            }
            if(!locationCalculated || !isDeliverable) {
                showToast("Please provide a valid delivery location within 20km.", "error", "Location Error");
                return;
            }
            customConfirm("Place order via Cash on Delivery?", async () => {
                await saveOrder('Cash on Delivery');
            });
        }
    </script>
