<script>
    let currentProduct = null;
    let currentProductId = null;

    document.addEventListener('DOMContentLoaded', () => {

        const urlParams = new URLSearchParams(window.location.search);
        currentProductId = parseInt(urlParams.get('id') || '1');

        // WAIT until backend products are loaded
        window.onProductsLoaded((data) => {

            currentProduct = data.find(p => p.id === currentProductId);

            if (!currentProduct) {
                console.error("Product not found");
                return;
            }

            populateProductDetails();
            setupUI();
        });
    });

    /* ---------------- POPULATE UI ---------------- */

    function populateProductDetails() {

        document.getElementById('detail-title').textContent = currentProduct.name;

        const priceNum = Number(currentProduct.price) || 0;
        const originalPriceNum = Number(currentProduct.original_price) || 0;

        document.getElementById('detail-price-sale').textContent =
            `₹${priceNum.toLocaleString('en-IN')}`;

        const origPriceElement = document.getElementById('detail-price-original');

        if (originalPriceNum > priceNum) {
            origPriceElement.textContent =
                `₹${originalPriceNum.toLocaleString('en-IN')}`;
            origPriceElement.style.display = 'inline-block';
        } else {
            origPriceElement.style.display = 'none';
        }

        document.getElementById('detail-desc').textContent = currentProduct.description;
        document.getElementById('bread-cat').textContent = currentProduct.category;
        document.getElementById('delivery-info').textContent = currentProduct.deliveryInfo;

        // stock
        const stockBadge = document.getElementById('stock-badge');
        stockBadge.textContent = `In Stock (${currentProduct.stock})`;
    }

    /* ---------------- UI + ACTIONS ---------------- */

    function setupUI() {

        // Quantity buttons
        document.getElementById('add-btn').onclick = () => {
            const qty = parseInt(document.getElementById('qty-input').value);
            addToCart(currentProduct.id, qty);
        };

        document.getElementById('buy-btn').onclick = () => {
            const qty = parseInt(document.getElementById('qty-input').value);
            addToCart(currentProduct.id, qty);
            window.location.href = 'checkout.html';
        };

        // WhatsApp
        updateWhatsAppLink();
        updateDetailHeart();

        // images
        setupImages();

        // reviews
        renderReviews();
    }

    /* ---------------- LIVE UPDATE (REAL-TIME FIX) ---------------- */

    setInterval(() => {
        if (!window.products || !currentProduct) return;

        const updated = window.products.find(p => p.id === currentProduct.id);

        if (updated && JSON.stringify(updated) !== JSON.stringify(currentProduct)) {
            currentProduct = updated;
            populateProductDetails();
            console.log("🔄 Product updated live");
        }

    }, 3000);

    /* ---------------- IMAGE SETUP ---------------- */

    function setupImages() {

        const mainImg = document.getElementById('detail-main-img');
        const thumbList = document.getElementById('thumb-list');

        thumbList.innerHTML = '';

        let images = [];

        if (Array.isArray(currentProduct.images) && currentProduct.images.length) {
            images = currentProduct.images;
        } else if (currentProduct.image) {
            images = [currentProduct.image];
        }

        mainImg.src = images[0] || fallbackImage;

        images.forEach((img, i) => {
            const thumb = document.createElement('img');
            thumb.src = img;
            thumb.className = 'thumbnail' + (i === 0 ? ' active' : '');

            thumb.onclick = () => {
                mainImg.src = img;
            };

            thumbList.appendChild(thumb);
        });
    }

    /* ---------------- WHATSAPP ---------------- */

    function updateWhatsAppLink() {

        if (!currentProduct) return;

        const qty = parseInt(document.getElementById('qty-input').value) || 1;

        const message =
`Hello Friends Florist 🌸

Product: ${currentProduct.name}
Quantity: ${qty}
Price: ₹${currentProduct.price}
Total: ₹${currentProduct.price * qty}

Please confirm order.`;

        document.getElementById('whatsapp-btn').href =
            `https://wa.me/917672057864?text=${encodeURIComponent(message)}`;
    }

    /* ---------------- REVIEWS ---------------- */

    function renderReviews() {
        const reviews = getProductReviews(currentProduct.id);

        const container = document.getElementById('reviews-container');

        container.innerHTML = reviews.map(r => `
            <div style="margin-bottom:15px;">
                <b>${r.name}</b> - ${'★'.repeat(r.rating)}
                <p>${r.text}</p>
            </div>
        `).join('');
    }

</script>
